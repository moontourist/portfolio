<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matt Erickson</title>
    <meta name="description" content="Infrastructure engineer at Halo in Washington state, learning C# and building toward a first game." />
    <!-- Link previews (Discord, Slack, iMessage). og.png is a screenshot of the poster. -->
    <meta property="og:title" content="Matt Erickson" />
    <meta property="og:description" content="Infrastructure engineer at Halo in Washington state, learning C# and building toward a first game." />
    <meta property="og:url" content="https://matt-erickson.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://matt-erickson.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=League+Spartan:wght@900&family=Zilla+Slab:wght@700&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before the page draws, so dark mode doesn't flash white
      let theme = null
      try { theme = localStorage.getItem('theme') } catch {}
      theme ??= matchMedia('(prefers-color-scheme: dark)').matches ? 'sverige-dark' : 'sverige'
      document.documentElement.dataset.theme = theme
      // Hide everything but the sky and mountain until they've been built (main.ts fades it in).
      // Failsafe: show the page after 6s even if the script never runs.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('intro')
        setTimeout(() => document.documentElement.classList.remove('intro'), 6000)
      }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Shown only when JavaScript is off; main.ts replaces everything inside #app -->
      <noscript>
        <main style="max-width: 40rem; padding: 3rem 1.5rem; font-family: monospace">
          <h1>Matt Erickson</h1>
          <p>Infrastructure Engineer at Halo, based in Washington state.</p>
          <p>
            <a href="mailto:matthewgaryerickson@gmail.com">matthewgaryerickson@gmail.com</a> ·
            <a href="https://www.linkedin.com/in/matthewg-erickson">LinkedIn</a> ·
            <a href="https://github.com/moontourist">GitHub</a> ·
            <a href="https://instagram.com/moon.tourist">Instagram</a>
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
