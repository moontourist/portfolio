<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matt Erickson</title>
    <meta name="description" content="Infrastructure engineer learning C# and working toward building a game." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before the page draws, so dark mode doesn't flash white
      let theme = null
      try { theme = localStorage.getItem('theme') } catch {}
      theme ??= matchMedia('(prefers-color-scheme: dark)').matches ? 'sverige-dark' : 'sverige'
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
